# KALKAN · Adım 7 · MLX LoRA yapılandırması (Qwen3.5-0.8B, v1)       v1.1 · 2026-11-21
# v1.1: ilk denemede Metal OOM (1. iter) → batch 2 + gradient checkpointing; veri miktarı aynı (~2 epoch).
# Çalıştır: make egit-08   (→ training/train.sh)
# Seçimlerin gerekçesi docs/adim-07-finetune.md'de. Değiştirirsen adapter_path'i de değiştir (v2, v3…).
model: ".spike/base"                 # bf16 HF checkpoint (spike'ta indirilen, model_sha versions.lock'ta)
train: true
data: "data/sft"
fine_tune_type: lora
optimizer: adamw
seed: 42

num_layers: -1                       # tüm katmanlar (0.8B küçük; kapasite lazım)
lora_parameters:
  rank: 16
  scale: 10.0
  dropout: 0.05

batch_size: 2                        # v1.1: 4 → OOM (sözlük ~248k: logit tensörü batch×uzunluk×248k)
iters: 1500                          # 1.496 / 2 = 748 iter = 1 epoch → ~2 epoch (v1 ile aynı veri miktarı)
learning_rate: 5.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 60
  warmup_init: 1.0e-7
  arguments: [5.0e-5, 1500, 1.0e-6]

mask_prompt: true                    # kayıp yalnızca asistan cevabında (sablon_parite.py ile doğrulanır)
max_seq_length: 1024
grad_checkpoint: true                # v1.1: aktivasyonları saklamak yerine yeniden hesapla (~%25 yavaş, çok daha az bellek)

steps_per_report: 10
steps_per_eval: 150                  # v1.1: 1500 iter'de 10 ölçüm (tam doğrulama ~50 sn)
val_batches: -1                      # doğrulamanın tamamı (198 örnek)
save_every: 150
adapter_path: "training/adapters/ft-0.8b-v1"
