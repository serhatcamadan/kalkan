# KALKAN v1 · 2026-11-18
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kalkan*"]   # data/, training/, deploy/ … paket değil

[project]
name = "kalkan"
version = "0.4.0"
description = "Türkçe dolandırıcılık mesajı analizcisi — kanıt önce, fail-closed"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13,<3", "pyyaml>=6.0"]   # httpx: Adım 5

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
eval = ["scikit-learn>=1.5"]          # Adım 4 TF-IDF taban çizgisi

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
