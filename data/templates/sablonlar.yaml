# KALKAN · sentetik mesaj şablonları                               v1.5 · 2026-11-22
# v1.5: Adım 8c sınıf dengesi: +10 meşru, +6 reklam eğitim şablonu (eğitim ağırlığı tools/veri_uret.py TUR_AGIRLIK).
# v1.4: Gemini şablon incelemesi (69 doğru / 7 düzelt / 1 çıkar): kamu_09 yeniden yazıldı (SMS'e uygun), kamu_12/14
#       sesli arama ifadeleri, mesru_13 tarih çelişkisi, yeni şablonlarda {RESMI_SITE}/<anlamlı yol>.
# v1.3: Adım 7b şablon çeşitliliği: tür başına eğitim 4→10, doğrulama 1→2 şablon. TEST ŞABLONLARINA DOKUNULMADI
#       (golden ve önceki tüm ölçümler karşılaştırılabilir kalır). Yeni şablonlar sınıflar arası tuzak içerir:
#       "kargo bedava" reklamı, şubede bekleyen meşru kargo, Türkçe ek/üslup çeşitliliği, linksiz/telefonlu sürümler.
# v1.2: Gemini ön-elemesi bulguları: yakınlık kanıtı hitabı içerir, reklam_07'de ret satırı, randevu mesai saatinde
# v1.1: rakam/marka sonrası Türkçe ek uyumu ("lira'ye", "Mobil'dan"), reklamda gerçekçi indirim oranı (%120 indirim yok)
#
# Söz dizimi
#   {a|b|c}          → rastgele biri (iç içe olabilir)
#   {SLOT}           → üretici doldurur (BÜYÜK HARF, | içermez). Liste: tools/veri_uret.py → SLOTLAR
#   ⟦sinyal:metin⟧   → KANIT işareti. "metin" mesajda birebir kalır ve hedef çıktıda alıntı olur.
#                      Şablon başına en fazla 3 işaret. sinyal ∈ data/taxonomy.yaml → sinyaller
#   split            → egitim | dogrulama | test   (ŞABLON BAZLI bölme: bir şablon tek bir bölümde)
#   marka            → {MARKA}, {LINK}, {RESMI_LINK} hangi marka grubundan seçilsin
#
# Tüm kurum ve marka adları KURGUSALDIR. Her bölümün kendi marka havuzu vardır (eğitimde görülen
# bir marka testte görünmez). Gerçek bir kurumla benzerlik kasıtlı değildir.

havuzlar:
  egitim:
    banka: [Mavibank, Ardıçbank, Lacivert Bank]
    kart: [Kuzeykart, Yonca Kart]
    kargo: [Hızlıkargo, Kumru Kargo]
    operator: [Turkuaz Mobil, Nar Telekom]
    eticaret: [Çarşıla, Sepetgo]
    kamu: [e-Hizmet Kapısı]
    oyun: [Kaleoyun, Vaporia]
    bahis: [golkral, betyildiz]
    yatirim: [Boğaz Yatırım]
  dogrulama:
    banka: [Çınarbank]
    kart: [Pusula Kart]
    kargo: [Serçe Lojistik]
    operator: [Lodos Mobil]
    eticaret: [Pazarcık]
    kamu: [Dijital Vatandaş]
    oyun: [Arenahub]
    bahis: [kupabet]
    yatirim: [Kule Menkul]
  test:
    banka: [Sedirbank, Ilgaz Bank]
    kart: [Poyraz Kart]
    kargo: [Turna Kargo]
    operator: [Gökkuşağı Mobil]
    eticaret: [Pazaryolu]
    kamu: [Kamu Portalı]
    oyun: [Zirvearena]
    bahis: [sahabet, tribunbet]
    yatirim: [Liman Portföy]

sablonlar:
# ───────────────────────────────────────────── sahte_kargo_gumruk
- id: kargo_01
  tur: sahte_kargo_gumruk
  split: egitim
  marka: kargo
  metin: "{MARKA}: {Paketiniz|Gönderiniz|Siparişiniz} gümrükte bekliyor. ⟦odeme_talebi:{TUTAR_K} gümrük {ücretini|bedelini} ödeyin⟧, ⟦aciliyet:{SURE} içinde ödenmezse iade edilecektir⟧. ⟦link:{LINK}⟧"
- id: kargo_02
  tur: sahte_kargo_gumruk
  split: egitim
  marka: kargo
  metin: "{Sayın müşterimiz|Değerli müşterimiz}, {TAKIP} numaralı gönderinizde ⟦kimlik_talebi:adres bilgileriniz eksik⟧. {Teslimat için|Gönderinizi almak için} ⟦link:{LINK}⟧ adresinden ⟦odeme_talebi:{TUTAR_K} adres güncelleme ücreti⟧ ödeyiniz."
- id: kargo_03
  tur: sahte_kargo_gumruk
  split: egitim
  marka: kargo
  metin: "{MARKA} | Kurye sizi adresinizde bulamadı. ⟦aciliyet:Yeniden dağıtım için son gün bugün⟧. ⟦odeme_talebi:{TUTAR_K} ödeyerek⟧ yeni teslim tarihi seçin: ⟦link:{KISA_LINK}⟧"
- id: kargo_04
  tur: sahte_kargo_gumruk
  split: egitim
  marka: kargo
  metin: "Yurt dışından gelen {paketiniz|koliniz} {için|adına} ⟦odeme_talebi:{TUTAR_K} vergi ödenmesi gerekmektedir⟧. Ödeme yapılmazsa {gönderi|paket} ⟦aciliyet:{SURE} sonra imha edilecek⟧. ⟦link:{LINK}⟧ {MARKA}"
- id: kargo_05
  tur: sahte_kargo_gumruk
  split: dogrulama
  marka: kargo
  metin: "{MARKA} bilgilendirme: {TAKIP} kodlu gönderinizin ⟦odeme_talebi:depo ücreti {TUTAR_K}⟧ olarak hesaplandı. ⟦aciliyet:{SURE} içinde⟧ ödemezseniz gönderi göndericiye döner. Ödeme: ⟦link:{LINK}⟧"
- id: kargo_06
  tur: sahte_kargo_gumruk
  split: test
  marka: kargo
  metin: "Merhaba, {MARKA} şubesinde adınıza kayıtlı bir koli var. ⟦kimlik_talebi:Teslim almak için kart bilgilerinizi doğrulayın⟧ ⟦link:{LINK}⟧ ⟦odeme_talebi:Hizmet bedeli {TUTAR_K}⟧"
- id: kargo_07
  tur: sahte_kargo_gumruk
  split: test
  marka: kargo
  metin: "SON UYARI: gönderiniz ⟦aciliyet:{bugün|yarın} saat {SAAT} itibarıyla iade edilecek⟧. ⟦odeme_talebi:Gümrük harcı {TUTAR_K}⟧, ödeme sayfası: ⟦link:{KISA_LINK}⟧"
# v1.3 (Adım 7b): +6 eğitim, +1 doğrulama şablonu
- id: kargo_08
  tur: sahte_kargo_gumruk
  split: egitim
  marka: kargo
  metin: "{MARKA}: Teslimat adresinizde {hata|eksiklik} tespit edildi, gönderiniz {şubede|depoda} bekletiliyor. ⟦link:Adresinizi {güncelleyin|onaylayın}: {KISA_LINK}⟧ ⟦odeme_talebi:Yeniden gönderim ücreti {TUTAR_K}⟧"
- id: kargo_09
  tur: sahte_kargo_gumruk
  split: egitim
  marka: kargo
  metin: "{Merhaba|İyi günler}, {MARKA} kuryesiyim. {TAKIP} nolu paketiniz için ⟦odeme_talebi:{TUTAR_K} eksik posta ücreti çıktı⟧. ⟦kanal_degistirme:Ödeme için WhatsApp'tan {TEL} numarasına yazın⟧, ⟦aciliyet:bugün yapılmazsa paket iade edilir⟧."
- id: kargo_10
  tur: sahte_kargo_gumruk
  split: egitim
  marka: kargo
  metin: "{MARKA} Bilgi: {TAKIP} sayılı gönderi için gümrük beyannamesi {düzenlendi|hazırlandı}. ⟦odeme_talebi:Vergi tutarı {TUTAR_O}, {IBAN} hesabına yatırılmalıdır⟧. Açıklamaya takip numaranızı yazınız. ⟦aciliyet:{SURE} içinde ödenmezse gönderi iade edilir⟧"
- id: kargo_11
  tur: sahte_kargo_gumruk
  split: egitim
  marka: kargo
  metin: "{Paketiniz|Kargonuz} teslim edilemedi. ⟦odeme_talebi:{TUTAR_K} ödeyip yeni teslim tarihi seçin⟧: ⟦link:{KISA_LINK}⟧ -{MARKA}"
- id: kargo_12
  tur: sahte_kargo_gumruk
  split: egitim
  marka: kargo
  metin: "⟦link:{LINK}⟧ adresinden ⟦kimlik_talebi:kimlik ve kart bilgilerinizi doğrulamadığınız sürece⟧ {MARKA} gönderiniz teslim edilmeyecektir. ⟦aciliyet:Sistem bugün saat {SAAT} itibarıyla kapanacak⟧."
- id: kargo_13
  tur: sahte_kargo_gumruk
  split: egitim
  marka: kargo
  metin: "{ETICARET} siparişiniz {MARKA} gümrük deposuna ulaştı. ⟦odeme_talebi:Teslimat için {TUTAR_K} gümrük vergisi gerekiyor⟧, ⟦link:ödeme bağlantısı {LINK}⟧ ⟦aciliyet:{SURE} sonra gönderi imha edilir⟧"
- id: kargo_14
  tur: sahte_kargo_gumruk
  split: dogrulama
  marka: kargo
  metin: "Sevgili müşterimiz, {MARKA} aracımız bugün adresinize uğradı ancak kimseye ulaşamadı. ⟦kanal_degistirme:Teslim saatini ayarlamak için {TEL} numaralı hatta mesaj atın⟧, ⟦odeme_talebi:randevu ücreti {TUTAR_K} kartla alınır⟧."

# ───────────────────────────────────────────── kurum_taklidi
- id: kurum_01
  tur: kurum_taklidi
  split: egitim
  marka: banka
  metin: "{Sayın müşterimiz|Değerli müşterimiz}, ⟦kurum_taklidi:{MARKA} hesabınız şüpheli işlem nedeniyle askıya alınmıştır⟧. ⟦aciliyet:{SURE} içinde⟧ ⟦kimlik_talebi:kimlik bilgilerinizi doğrulayın⟧: {LINK}"
- id: kurum_02
  tur: kurum_taklidi
  split: egitim
  marka: kart
  metin: "⟦kurum_taklidi:{MARKA}: Kartınızdan {TUTAR_O} tutarında işlem yapıldı⟧. Size ait değilse ⟦kimlik_talebi:iptal için giriş yapın⟧ ⟦link:{LINK}⟧"
- id: kurum_03
  tur: kurum_taklidi
  split: egitim
  marka: operator
  metin: "{MARKA}: {Hattınız|Numaranız} ⟦aciliyet:{SURE} içinde kapatılacaktır⟧. ⟦kimlik_talebi:e-imza doğrulaması için TC kimlik numaranızı ve şifrenizi⟧ {girin|tamamlayın}: ⟦link:{LINK}⟧"
- id: kurum_04
  tur: kurum_taklidi
  split: egitim
  marka: banka
  metin: "{MARKA} Güvenlik Birimi: ⟦kod_talebi:telefonunuza gelen doğrulama kodunu bu numaraya iletin⟧, ⟦aciliyet:aksi halde hesabınız bloke edilecek⟧. Destek hattı: ⟦kanal_degistirme:{TEL} numarasını arayın⟧"
- id: kurum_05
  tur: kurum_taklidi
  split: dogrulama
  marka: kamu
  metin: "{MARKA}: Adınıza ⟦odul_vaadi:{TUTAR_O} vergi iadesi⟧ tanımlanmıştır. ⟦kimlik_talebi:İadeyi almak için kart bilgilerinizi girin⟧: ⟦link:{LINK}⟧"
- id: kurum_06
  tur: kurum_taklidi
  split: test
  marka: banka
  metin: "⟦kurum_taklidi:{MARKA}: mobil şubeniz yeni cihazda açıldı⟧. Siz değilseniz ⟦aciliyet:hemen⟧ ⟦kimlik_talebi:bilgilerinizi güncelleyin⟧ {LINK}"
- id: kurum_07
  tur: kurum_taklidi
  split: test
  marka: eticaret
  metin: "{MARKA} hesabınızda olağandışı giriş tespit edildi. ⟦kimlik_talebi:Hesabınızı korumak için şifrenizi yenileyin⟧ ⟦link:{LINK}⟧ ⟦aciliyet:{SURE} içinde işlem yapılmazsa hesabınız silinir⟧"
# v1.3 (Adım 7b): +6 eğitim, +1 doğrulama şablonu
- id: kurum_08
  tur: kurum_taklidi
  split: egitim
  marka: kamu
  metin: "{MARKA}: Adınıza kesilmiş ⟦kurum_taklidi:{TUTAR_K} tutarında ödenmemiş trafik cezası bulunmaktadır⟧. ⟦aciliyet:{SURE} içinde ödenmezse ceza iki katına çıkar⟧. ⟦link:Ödeme: {LINK}⟧"
- id: kurum_09
  tur: kurum_taklidi
  split: egitim
  marka: eticaret
  metin: "{MARKA}: {TUTAR_O} tutarındaki iadeniz onaylandı ancak ⟦kimlik_talebi:kart bilgileriniz doğrulanamadı⟧. ⟦link:İadeyi almak için {LINK}⟧ ⟦aciliyet:{SURE} içinde işlem yapılmazsa iade iptal olur⟧"
- id: kurum_10
  tur: kurum_taklidi
  split: egitim
  marka: operator
  metin: "Sayın abonemiz, ⟦kurum_taklidi:{MARKA} hattınızın kayıt süresi dolmuştur⟧. ⟦kimlik_talebi:Hattınızın kapanmaması için kimlik numaranızı ve doğum tarihinizi⟧ {LINK} üzerinden girin. ⟦aciliyet:Son gün {TARIH}⟧"
- id: kurum_11
  tur: kurum_taklidi
  split: egitim
  marka: kart
  metin: "{MARKA}: {TUTAR_O} limit artışı talebiniz alındı. ⟦kod_talebi:Talebi iptal etmek için size gelen kodu {TEL} numarasına SMS ile gönderin⟧ ⟦aciliyet:{SURE} içinde⟧"
- id: kurum_12
  tur: kurum_taklidi
  split: egitim
  marka: banka
  metin: "{MARKA} Müşteri Hizmetleri: ⟦kurum_taklidi:hesabınıza yurt dışından giriş denemesi yapıldı⟧. ⟦kanal_degistirme:Güvenlik ekibimizle görüşmek için {TEL} numarasını arayın⟧, ⟦aciliyet:{SURE} içinde aramazsanız kartınız iptal edilecek⟧."
- id: kurum_13
  tur: kurum_taklidi
  split: egitim
  marka: kamu
  metin: "{MARKA} bildirimi: ⟦kurum_taklidi:adınıza düzenlenen elektronik tebligat teslim edilemedi⟧. ⟦kimlik_talebi:Tebligatı görüntülemek için T.C. kimlik numaranız ve şifrenizle giriş yapın⟧ ⟦link:{KISA_LINK}⟧"
- id: kurum_14
  tur: kurum_taklidi
  split: dogrulama
  marka: operator
  metin: "{MARKA}: ⟦kurum_taklidi:faturanız iki kez tahsil edildiği için {TUTAR_K} iade edilecektir⟧. ⟦kimlik_talebi:İade için kart numaranızı ve son kullanma tarihini⟧ ⟦link:{LINK}⟧ adresine girin."

# ───────────────────────────────────────────── sahte_kamu_gorevlisi
- id: kamu_01
  tur: sahte_kamu_gorevlisi
  split: egitim
  marka: banka
  metin: "⟦yetki_iddiasi:Cumhuriyet Başsavcılığı: adınıza açılan hesap bir {terör|dolandırıcılık} soruşturmasında kullanılmıştır⟧. ⟦odeme_talebi:Paranızı güvenceye almak için emanet hesaba aktarın⟧. ⟦gizlilik_baskisi:Soruşturma gizlidir, kimseye söylemeyin⟧."
- id: kamu_02
  tur: sahte_kamu_gorevlisi
  split: egitim
  marka: banka
  metin: "Merhaba {Hanımefendi|Beyefendi}, ⟦yetki_iddiasi:ben Emniyet Siber Suçlar biriminden {AD} Komiser⟧. {MARKA} hesabınızdan şüpheli para çıkışı var. ⟦kanal_degistirme:Sizi {TEL} numarasından arayacağız⟧, ⟦gizlilik_baskisi:banka çalışanlarına bilgi vermeyin⟧."
- id: kamu_03
  tur: sahte_kamu_gorevlisi
  split: egitim
  marka: banka
  metin: "⟦yetki_iddiasi:MASAK tebligatı: hesabınızda {TUTAR_B} tutarında şüpheli hareket⟧ tespit edildi. ⟦kod_talebi:Doğrulama için size gelen kodu görevliye okuyun⟧. ⟦aciliyet:{SURE} içinde dönüş yapmazsanız hakkınızda yakalama kararı çıkarılacaktır⟧."
- id: kamu_04
  tur: sahte_kamu_gorevlisi
  split: egitim
  marka: banka
  metin: "{Amca|Teyze|Efendim}, ⟦yetki_iddiasi:savcılıktan arıyoruz, HERA soruşturması kapsamında⟧ ⟦odeme_talebi:altınlarınızı ve nakit paranızı tutanakla teslim almamız gerekiyor⟧. ⟦gizlilik_baskisi:Çocuklarınız dahil kimseye anlatmayın⟧."
- id: kamu_05
  tur: sahte_kamu_gorevlisi
  split: dogrulama
  marka: banka
  metin: "⟦yetki_iddiasi:Jandarma Komutanlığı: kimliğiniz bir şebeke tarafından kullanılmıştır⟧. ⟦odeme_talebi:Birikimlerinizi {IBAN} numaralı güvenli emanet hesabına aktarmanız gerekiyor⟧. ⟦gizlilik_baskisi:Bankaya gitmeyin, işlem telefonla yapılacak⟧."
- id: kamu_06
  tur: sahte_kamu_gorevlisi
  split: test
  marka: banka
  metin: "⟦yetki_iddiasi:İl Emniyet Müdürlüğü Mali Şube: {MARKA} kartınız yasa dışı bahiste kullanılmış⟧. ⟦kod_talebi:Hesabınızın dondurulmaması için SMS ile gelen onay kodunu söyleyin⟧, ⟦gizlilik_baskisi:aramızda kalsın⟧."
- id: kamu_07
  tur: sahte_kamu_gorevlisi
  split: test
  marka: banka
  metin: "Sayın vatandaşımız, ⟦yetki_iddiasi:hakkınızda dolandırıcılık soruşturması başlatılmıştır⟧. ⟦kanal_degistirme:Dosya numaranız için {TEL} numaralı savcılık hattını arayın⟧. ⟦aciliyet:{SURE} içinde aramazsanız gıyabınızda işlem yapılacaktır⟧."
# v1.3 (Adım 7b): +6 eğitim, +1 doğrulama şablonu
- id: kamu_08
  tur: sahte_kamu_gorevlisi
  split: egitim
  marka: banka
  metin: "Sayın {AD} {Bey|Hanım}, ⟦yetki_iddiasi:ben Cumhuriyet Savcısıyım, dosyanız bende⟧. ⟦kanal_degistirme:Görüntülü görüşme için WhatsApp'tan {TEL} numarasına yazın⟧. ⟦gizlilik_baskisi:Bu görüşmeyi kimseyle paylaşmanız yasaktır⟧."
- id: kamu_09
  tur: sahte_kamu_gorevlisi
  split: egitim
  marka: banka
  metin: "⟦yetki_iddiasi:Emniyet Dolandırıcılık Büro Amirliği: adınıza açılan bir banka hesabı soruşturmaya konu olmuştur⟧. ⟦kanal_degistirme:İfadeniz için bugün {TEL} numaralı memurumuzu arayınız⟧. ⟦gizlilik_baskisi:Soruşturma gizlidir, bankanızla paylaşmayınız⟧."
- id: kamu_10
  tur: sahte_kamu_gorevlisi
  split: egitim
  marka: banka
  metin: "⟦yetki_iddiasi:Vergi Denetim Kurulu müfettişi {AD}⟧: adınıza sahte fatura düzenlenmiş. ⟦odeme_talebi:Hesabınızdaki parayı soruşturma bitene kadar {IBAN} numaralı kamu hesabına aktarın⟧. ⟦gizlilik_baskisi:Avukatınızla dahi konuşmayın⟧."
- id: kamu_11
  tur: sahte_kamu_gorevlisi
  split: egitim
  marka: banka
  metin: "⟦yetki_iddiasi:Siber Polis: hattınız bir dolandırıcılık olayında kullanıldı⟧. ⟦kod_talebi:Hattınızın kapatılmaması için gelen SMS kodunu memura söyleyin⟧ ⟦aciliyet:1 saat içinde⟧"
- id: kamu_12
  tur: sahte_kamu_gorevlisi
  split: egitim
  marka: banka
  metin: "{MARKA} hesabınızla ilgili ⟦yetki_iddiasi:Jandarma Siber birimi olarak ulaşıyoruz⟧. ⟦kimlik_talebi:Kimliğinizi doğrulamak için internet bankacılığı şifrenizi bu numaraya iletin⟧, ⟦gizlilik_baskisi:bankayı aramayın, onlar da şüpheli⟧."
- id: kamu_13
  tur: sahte_kamu_gorevlisi
  split: egitim
  marka: banka
  metin: "⟦yetki_iddiasi:Ben Başsavcılıktan Savcı {AD}, telefonla ifadenizi alacağım⟧. ⟦kod_talebi:Kimlik teyidi için size gelen 6 haneli kodu söyleyin⟧. ⟦gizlilik_baskisi:İfade gizlidir, ailenize anlatmayın⟧."
- id: kamu_14
  tur: sahte_kamu_gorevlisi
  split: dogrulama
  marka: banka
  metin: "Merhaba, ⟦yetki_iddiasi:Terörle Mücadele Şube'den Başkomiser {AD}⟧. Kimliğinizle açılmış hesaplar var. ⟦kanal_degistirme:Sizi birazdan {TEL} numarasından savcımız arayacak⟧, ⟦gizlilik_baskisi:çağrıyı mutlaka yanıtlayın ve kimseye haber vermeyin⟧."

# ───────────────────────────────────────────── yatirim_vip_grup
- id: yatirim_01
  tur: yatirim_vip_grup
  split: egitim
