# Bir örnek bir düzeltmeyi tetiklerse o örnek "kör" olmaktan çıkar (kor: false) ve yeni kör örnek yazılır.
# İstisna: kor_01, kor_02, kor_20 kırpma kuralıyla (service v1.2 / katman v1.1) AYNI anda yazıldı → kor: false.
# v1.1: kor_13 politika v1.2'yi (IBAN kuralı) tetikledi → kor: false. Yeni kör örnekler: kor_21, kor_22, kor_24.
#       kor_23 v1.2 kuralının BEDELİNİ görmek için kuralla birlikte yazıldı → kor: false (meşru, IBAN'lı).
# Alanlar adversarial.yaml ile aynı; ek: dolgu + dolgu_tekrar (metnin ÖNÜNE eklenir), dolgu_sona (SONA eklenir).
